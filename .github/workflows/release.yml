name: Windows release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build tools
        run: python -m pip install -r requirements-build.txt
      - name: Build and test executable
        run: ./build-windows.ps1
      - name: Create checksum
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 dist/NewsRadar.exe).Hash.ToLowerInvariant()
          "$hash  NewsRadar.exe" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - name: Publish verified Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          $draft = gh release view $env:RELEASE_TAG --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($draft -ne 'true') {
              Write-Output "Release $env:RELEASE_TAG is already published; leaving it unchanged."
              exit 0
            }
          } else {
            gh release create $env:RELEASE_TAG --verify-tag --draft --title "News Radar $env:RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          }
          gh release upload $env:RELEASE_TAG dist/NewsRadar.exe dist/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed.' }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
